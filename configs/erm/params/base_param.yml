optim:
  batch_size: 64
  eval_batch_size: 128
  load_balancing: atoms
  num_workers: 4
  clip_grad_norm: 10
  max_epochs: 200
  ema_decay: 0.999
  lr_initial: 0.001
  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001
  scheduler: ReduceLROnPlateau
  mode: min
  factor: 0.8
  patience: 5
